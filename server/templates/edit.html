{% extends "base.html" %}
{% block content %}
<h1>{{ old or "New" }}</h1>
<p class="error">{{ error }}</p>
<form method="post" action="/edit" class="editor" data-max-bytes="{{ max_body }}">
<input type="hidden" name="old" value="{{ old }}">
<input type="hidden" name="key" value="{{ key }}">
<textarea name="text" rows="10">{{ text }}</textarea>
<p class="upload"><label>Add image <input type="file" id="image" accept="image/png,image/jpeg,image/gif,image/webp" multiple></label>
or drop or paste one into the text.</p>
<p id="upload-status"></p>
<p><button name="action" value="save">Save</button>
{% if old %}
<button name="action" value="delete" data-confirm="Delete this file?" onclick="return confirm(this.dataset.confirm)">Delete</button>
{% endif %}
</p>
</form>
<script src="/static/editor.js"></script>
{% endblock %}
